name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-features -- -D warnings

  commit-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: install commitizen
        run: uv tool install commitizen
      - name: check commit messages
        run: cz check --rev-range origin/${{ github.base_ref }}..HEAD

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        toolchain: [stable, "1.86"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - name: test
        run: cargo test --all-features --locked
      - name: run examples
        run: |
          cargo run --example core
          cargo run --example fields
          cargo run --example symbolic
          cargo run --example writing
          cargo run --example proptest_fuzz --features proptest
          cargo run --example bulk --features bulk
      - name: validate committed profiles through Rust
        run: |
          cargo build --features bulk --bin validate-profile
          for f in profiles/*.json; do
            cargo run --quiet --features bulk --bin validate-profile -- "$f"
          done
