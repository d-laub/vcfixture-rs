[package]
name = "vcfixture"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Generate small VCF test data with decoded ground truth, for property-based testing."
repository = "https://github.com/d-laub/vcfixture-rs"
readme = "README.md"
keywords = ["vcf", "testing", "fixtures", "bioinformatics", "proptest"]
categories = ["development-tools::testing", "science"]
rust-version = "1.86"

[dependencies]
ndarray = "0.16"
indexmap = "2"
thiserror = "2"
rand = "0.8"
rand_chacha = "0.3"
noodles-core = "0.18"
noodles-vcf = "0.83"
noodles-bgzf = "0.45"
noodles-csi = "0.53"
noodles-tabix = "0.59"
noodles-fasta = "0.58"
proptest = { version = "1", optional = true }
noodles-bcf = { version = "0.81", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
rayon = { version = "1", optional = true }
clap = { version = "4", features = ["derive"], optional = true }

[dev-dependencies]
insta = "1"
proptest = "1"
tempfile = "3"

[features]
default = []
proptest = ["dep:proptest"]
bulk = ["dep:noodles-bcf", "dep:serde", "dep:serde_json", "dep:rayon"]
cli = ["bulk", "dep:clap"]

[[example]]
name = "proptest_fuzz"
required-features = ["proptest"]

[[bin]]
name = "vcfixture"
path = "src/bin/vcfixture.rs"
required-features = ["cli"]

[package.metadata.docs.rs]
all-features = true
