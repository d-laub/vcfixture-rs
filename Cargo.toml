[package]
name = "vcfixture"
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
description = "Generate small VCF test data with decoded ground truth, for property-based testing."
repository = "https://github.com/d-laub/vcfixture-rs"
readme = "README.md"
keywords = ["vcf", "testing", "fixtures", "bioinformatics", "proptest"]
categories = ["development-tools::testing", "science"]
rust-version = "1.86"

[dependencies]
ndarray = "0.16"
indexmap = "2"
thiserror = "2"
rand = "0.9"
rand_chacha = "0.9"
noodles-core = "0.18"
noodles-vcf = "0.83"
noodles-bgzf = "0.45"
noodles-csi = "0.53"
noodles-tabix = "0.59"
noodles-fasta = "0.58"
proptest = { version = "1", optional = true }
noodles-bcf = { version = "0.81", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
rayon = { version = "1", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
tempfile = { version = "3", optional = true }
# Used only by the [[bin]] and [[example]] targets, never by the library --
# see the `#[global_allocator]` comment in `src/bin/vcfixture.rs`.
mimalloc = { version = "0.1", default-features = false, optional = true }

[dev-dependencies]
insta = "1"
proptest = "1"
tempfile = "3"
noodles-bcf = "0.81"

[features]
default = ["mimalloc"]
proptest = ["dep:proptest"]
bulk = ["dep:noodles-bcf", "dep:serde", "dep:serde_json", "dep:rayon", "dep:tempfile"]
cli = ["bulk", "dep:clap"]
# Swaps the *binaries'* global allocator to mimalloc. On by default; opt out
# with `--no-default-features`. The library never installs a global
# allocator whatever this is set to.
mimalloc = ["dep:mimalloc"]

[[example]]
name = "proptest_fuzz"
required-features = ["proptest"]

[[example]]
name = "bulk"
required-features = ["bulk"]

[[example]]
name = "bulk_bench"
required-features = ["bulk"]

[[bin]]
name = "vcfixture"
path = "src/bin/vcfixture.rs"
required-features = ["cli"]

[[bin]]
name = "validate-profile"
path = "src/bin/validate_profile.rs"
required-features = ["bulk"]

[package.metadata.docs.rs]
all-features = true

[package.metadata.cargo-semver-checks.lints]
# Off by default (the lint ships `lint_level: Allow`) and only `Minor`-required,
# which on a 0.x crate any assumed release already satisfies -- so out of the
# box this lint can never fire. Both dials have to be turned up.
enum_no_longer_non_exhaustive = { level = "deny", required-update = "major" }
